name: Verificar novas notas

on:
  # ===========================================================
  # AQUI VOCÊ CONFIGURA DE QUANTO EM QUANTO TEMPO O SCRIPT RODA.
  # Formato cron: minuto hora dia mês dia-da-semana (horário UTC!).
  # Exemplos:
  #   "*/30 * * * *"  -> a cada 30 minutos
  #   "0 * * * *"     -> uma vez por hora, no minuto 0
  #   "0 9-23/2 * * *"-> a cada 2h, das 6h às 20h (Brasil, UTC-3)
  # Lembrando: GitHub Actions roda em UTC. Brasil = UTC-3 (ou -4 no
  # horário padrão sem horário de verão). Ajuste os horários pensando
  # nisso, ex: 9h no Brasil = 12h UTC.
  # ===========================================================
  schedule:
    - cron: "*/5 * * * *"

  # Permite rodar manualmente pela aba "Actions" no GitHub, útil pra testar
  workflow_dispatch:

permissions:
  contents: write  # necessário para o workflow poder salvar o notas_state.json

jobs:
  checar-notas:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar o código do repositório
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependências
        run: |
          pip install -r requirements.txt
          playwright install --with-deps chromium

      - name: Rodar verificação de notas
        env:
          PORTAL_USUARIO: ${{ secrets.PORTAL_USUARIO }}
          PORTAL_SENHA: ${{ secrets.PORTAL_SENHA }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: python check_notas.py

      - name: Subir prints de diagnóstico (só roda se der erro)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: debug-login
          path: |
            debug_login.png
            debug_login.html
          if-no-files-found: ignore
          retention-days: 3

      - name: Salvar o novo estado das notas no repositório
        run: |
          git config user.name "aviso-notas-bot"
          git config user.email "bot@users.noreply.github.com"
          git add notas_state.json
          git diff --quiet --cached || git commit -m "Atualiza estado das notas [skip ci]"
          git push
