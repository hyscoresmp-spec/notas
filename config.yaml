# ============================================================
# CONFIGURAÇÃO DO AVISADOR DE NOTAS
# ============================================================
# Edite este arquivo para ajustar o comportamento do sistema.
# Nada aqui é secreto (senhas e webhooks ficam nos "Secrets"
# do GitHub, veja o README.md).
# ============================================================

portal:
  # URL da tela de notas do portal (a página que o script vai abrir)
  url: "https://inspetoriasalesiana146993.rm.cloudtotvs.com.br/FrameHTML/web/app/edu/PortalEducacional/#/notas"

  # Endpoint da API que retorna as notas em JSON (já descoberto via HAR)
  api_notas_endpoint: "TOTVSEducacional/NotaEtapa"

  # Seletores da tela de LOGIN.
  # IMPORTANTE: provavelmente vão precisar de ajuste — veja o README,
  # seção "Como descobrir os seletores de login", para o passo a passo
  # de como confirmar/corrigir estes valores usando o DevTools (F12).
  selectors:
    username_input: "#User"
    password_input: "#Pass"
    submit_button: "button[ng-click='controller.validarDadosLogin()']"

  # Quanto tempo (em milissegundos) esperar após enviar o login
  # antes de considerar que a página carregou.
  wait_after_login_ms: 8000

  # Tempo máximo de espera (ms) pela resposta da API de notas
  wait_for_notas_ms: 20000

# Às vezes (nem sempre) o portal mostra uma tela pedindo pra escolher
# a turma/série antes de ir para as notas. Esta seção configura qual
# opção o script deve escolher automaticamente quando isso acontecer.
turma:
  # Se false, o script nunca tenta escolher turma (só ignora essa tela)
  selecionar: true

  # Texto que precisa aparecer na opção (não precisa ser exato,
  # nem diferenciar maiúsculas/minúsculas). Deixe em branco ("") se
  # não quiser filtrar por isso.
  serie_contendo: "9º ANO"

  # Mesma ideia, pra filtrar também pelo ano letivo. Deixe em branco
  # se não precisar.
  ano_letivo_contendo: "2026"

notifications:
  email:
    enabled: true
    # Para quem o aviso deve ser enviado
    to: "naybofc@gmail.com"
    # Assunto do e-mail
    subject: "📚 Nova nota lançada no portal!"
    # Formato do aviso por e-mail quando uma nota muda (não afeta a
    # primeira execução, que sempre manda o boletim completo).
    # Deixe só UMA das três opções abaixo como "true".
    formato_mensagem:
      mensagem_direta: true   # manda só a(s) nota(s) que mudou(aram)
      mensagem_longa: false   # manda só o boletim completo
      os_dois: false          # manda as duas coisas juntas

  discord:
    enabled: true
    # Mesma ideia do e-mail, mas só pro Discord — pode deixar
    # diferente do e-mail se quiser.
    formato_mensagem:
      mensagem_direta: true
      mensagem_longa: false
      os_dois: false

# Se true, o script também avisa na primeira execução (quando ainda
# não existe nenhum histórico salvo), mandando o boletim completo
# como "primeira leitura".
avisar_na_primeira_execucao: true
